target-version = "py311"
line-length = 110

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "S",    # bandit (security)
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert used (fine for now)
    "B008",   # function call in default arg (FastAPI Depends pattern)
    "S105",   # possible hardcoded password (false positives on env var names)
    "S107",   # same as above
]

[lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
