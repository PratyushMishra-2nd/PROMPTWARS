name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default; jobs that need more must opt in explicitly.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        # Untrusted PR code runs here. No secrets are exposed to this job, and
        # network egress is the only blast radius. Keep deps reproducible.
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint with ruff
        run: ruff check app tests
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install
        # --frozen-lockfile prevents a malicious PR from editing package.json
        # to pull arbitrary deps that execute install scripts in CI.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: pnpm build
